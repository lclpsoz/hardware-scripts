# Timed unblock for the work laptop's Pi-hole focus groups.
# Docs: raspberry-pi/15-focus-blocking.md
services:
  focus:
    container_name: focus
    image: python:3.13-alpine
    network_mode: host              # port 8095 on the LAN, Pi-hole API on 127.0.0.1:8080
    user: "1000:1000"
    command: ["python", "-u", "/app/focus.py"]
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./focus.py:/app/focus.py:ro
      - ./ui.html:/app/ui.html:ro
      - ./data:/data
      - /home/lclpsoz/pihole/etc-pihole/cli_pw:/run/secrets/pihole_cli_pw:ro   # Pi-hole API password
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    cpus: "0.15"
    restart: unless-stopped
