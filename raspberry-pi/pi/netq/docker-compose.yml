# netq: internet quality logger, served at http://net.lan through the proxy.
# Deployed to ~/netq on the Pi. Docs: raspberry-pi/08-internet-quality.md
services:
  netq:
    container_name: netq
    image: python:3.13-alpine
    command: ["python", "-u", "/app/netq.py"]
    network_mode: host            # pings and DNS go out from the Pi itself
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW                   # ICMP echo (ping) through a raw socket
    environment:
      NETQ_BIND: 127.0.0.1        # only the proxy talks to it
      NETQ_PORT: "8098"
      NETQ_PING: router=192.168.0.1,isp=100.66.64.1,cloudflare=1.1.1.1,google=8.8.8.8
      NETQ_DNS: pihole=127.0.0.1,pihole_new=127.0.0.1,forwarder=127.0.0.1:5053,cloudflare=1.1.1.1,google=8.8.8.8
      NETQ_SPEED_EVERY_H: "6"     # 0 turns the scheduled speed test off
    volumes:
      - ./netq.py:/app/netq.py:ro
      - ./data:/data
    tmpfs:
      - /tmp
    mem_limit: 64m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    restart: unless-stopped
