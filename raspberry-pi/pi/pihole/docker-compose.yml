services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    environment:
      TZ: "America/Sao_Paulo"
      FTLCONF_webserver_api_password: "<redacted>"
      FTLCONF_dns_listeningMode: "LOCAL"
      # Web UI moved off port 80 so the .lan proxy (~/proxy) can use it. See hardware repo raspberry-pi/07-services.md
      FTLCONF_webserver_port: "8080o,8443os,[::]:8080o,[::]:8443os"
    volumes:
      - ./etc-pihole:/etc/pihole
    restart: unless-stopped
    # Undervoltage workaround (22 Nov): the image checks every 30 s, and each docker exec wakes dockerd and containerd.
    # Remove this block to go back to the image default when the new power supply is confirmed good.
    healthcheck:
      interval: 5m
