dns.hosts = [ 192.168.0.250 home.lan, 192.168.0.250 pi.lan, 192.168.0.250 pihole.lan, 192.168.0.250 netalertx.lan, 192.168.0.250 beszel.lan, 192.168.0.250 power.lan, 192.168.0.250 net.lan, 192.168.0.250 ntfy.lan, 192.168.0.250 steps.lan, 192.168.0.250 focus.lan, 192.168.0.1 router.lan ]    # default [] (set in pihole.toml)
database.DBinterval = 300    # default 60 (set in pihole.toml)
webserver.port = 8080o,8443os,[::]:8080o,[::]:8443os    # default "80o,443os,[::]:80o,[::]:443os" (set in compose env)
webserver.api.pwhash = "<redacted>"
files.macvendor = /macvendor.db    # default "/etc/pihole/macvendor.db" (set in pihole.toml)
