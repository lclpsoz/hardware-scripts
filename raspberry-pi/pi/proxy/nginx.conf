# Reverse proxy for the .lan service names on the Pi (rasp-al-gaib-lite).
# Deployed to ~/proxy/nginx.conf. Docs: raspberry-pi/07-services.md
#
# Pi-hole's own web server was moved from port 80 to 8080 (FTLCONF_webserver_port
# in ~/pihole/docker-compose.yml) so this proxy can own port 80.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;              # no per-request log lines: saves SD card writes
    sendfile      on;
    server_tokens off;
    client_max_body_size 64m;       # Pi-hole Teleporter restores are uploads

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;              # Beszel and NetAlertX keep live connections open
    proxy_buffering    off;

    # home.lan, pi.lan and the bare IP: the links page. /admin and /api go to
    # Pi-hole so old bookmarks such as http://192.168.0.250/admin keep working.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name home.lan pi.lan _;
        root /srv/home;
        index index.html;
        location /admin { proxy_pass http://127.0.0.1:8080; }
        location /api   { proxy_pass http://127.0.0.1:8080; }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name pihole.lan pi.hole;
        location = / { return 302 /admin/; }
        location /   { proxy_pass http://127.0.0.1:8080; }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name netalertx.lan;
        location / { proxy_pass http://127.0.0.1:20211; }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name beszel.lan;
        location / { proxy_pass http://127.0.0.1:8090; }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name power.lan;
        location / { proxy_pass http://127.0.0.1:8099; }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name net.lan;
        location / { proxy_pass http://127.0.0.1:8098; }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name ntfy.lan;
        client_max_body_size 1m;
        location / {
            proxy_pass http://127.0.0.1:2586;
            proxy_read_timeout 3d;      # long-lived subscriptions (stream and websocket)
        }
    }
}
